<!doctype html><html><body style="margin:0;background:#888">
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/examples/jsm/loaders/DRACOLoader.js';
import { toCreasedNormals } from 'three/examples/jsm/utils/BufferGeometryUtils.js';
import { FBXLoader } from 'three/examples/jsm/loaders/FBXLoader.js';
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
r.toneMapping = THREE.ACESFilmicToneMapping;
const s = new THREE.Scene(); s.background = new THREE.Color(0x9aa4ad);
s.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
const sun = new THREE.DirectionalLight(0xffffff, 2); sun.position.set(3, 5, 4); s.add(sun);
const l = new GLTFLoader(); const d = new DRACOLoader(); d.setDecoderPath('/draco/'); l.setDRACOLoader(d);
const g = /\.fbx$/i.test(q.get('f')) ? { scene: await new FBXLoader().loadAsync(q.get('f')) } : await l.loadAsync(q.get('f'));
const m = g.scene; s.add(m);
if (q.get('crease')) m.traverse((o) => { if (o.isMesh) o.geometry = toCreasedNormals(o.geometry, +q.get('crease') * Math.PI / 180); });
const box = new THREE.Box3().setFromObject(m); const c = box.getCenter(new THREE.Vector3()); const sz = box.getSize(new THREE.Vector3());
const big = []; m.traverse((o) => { if (o.isMesh) { const b = new THREE.Box3().setFromObject(o); const v = b.getSize(new THREE.Vector3()); big.push([o.name, v.toArray().map((x) => +x.toFixed(2)), b.getCenter(new THREE.Vector3()).toArray().map((x) => +x.toFixed(2))]); } });
big.sort((a, b) => Math.max(...b[1]) - Math.max(...a[1]));
window.info = { size: sz.toArray(), center: c.toArray(), big: big.slice(0, 8) };
s.add(new THREE.Box3Helper(box, 0xff0000));
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 1000);
const R = Math.max(sz.x, sz.y, sz.z) * 1.6; const a = +(q.get('a') || 0.7);
cam.position.set(c.x + Math.sin(a) * R, c.y + R * 0.45, c.z + Math.cos(a) * R); cam.lookAt(c);
r.render(s, cam); window.done = true;
</script></body></html>
